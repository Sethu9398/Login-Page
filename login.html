<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container-fluid d-flex justify-content-center align-items-center vh-100 " style="background-color: rgb(250, 249, 254);">
        <div class="card text-center card-style shadow" style="width: 600px; height:auto; padding:10px 80px; border-radius: 10px;">
            <img src="Asset/logo.png" alt="logo" class="d-block mx-auto mt-2" style="width: 80px; height: 80px; ">
            <h4>Welcome Back</h4>
            <p class="text-secondary">Sign in to your account to continue</p>
            <div class="card-body">
                <form id="loginForm">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-bold d-flex flex-start">Email address</label>
                        <input type="email" class="form-control" id="username" placeholder="Email">
                    </div>
                    <div>
                        <label for="password" class="form-label fw-bold d-flex flex-start">Password</label>
                        <div class="input-group mb-3">
                            <input type="password" class="form-control" id="password" placeholder="Password">
                            <span class="input-group-text bg-white" style="border-left: 0px">&#128065;</span>
                        </div>
                        <div id="passwordHelpBlock" class="form-text d-flex justify-content-between align-items-start my-3">
                            <div class="form-check d-flex align-items-center ms-2">
                                <input class="form-check-input fs-5 mt-0 checkboxleftmargin" type="checkbox" value="" id="checkDefault">
                                <label class="form-check-label ms-2 fw-medium" for="checkDefault">
                                    Remember me
                                </label>
                            </div>
                            <div>
                                <p class="text-primary ">Forget Password?</p>
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary d-flex justify-content-center w-100 text-center">Sign
                        in</button>
                    <div class="d-flex my-3">
                        <hr style="width: 250px;"><span class="mx-2">or</span>
                        <hr style="width: 250px;">
                    </div>
                    <button class="btn d-flex btn-light d-flex justify-content-center w-100 text-center bg-white border border-dark-subtle fw-bold"><span><img src="Asset/google.png" class="me-2" style="width: 25px; height: 25px;" alt="Google Logo"></span> Sign in with Google</button>
                    <div class=" mb-2 mt-4">
                        <p class="text-secondary">don't have an account ? <a class="text-primary text-decoration-none" href="#">Sign up</a></p>
                    </div>
                </form>

            </div>


        </div>

    </div>

    <script>
        const dummyEmail="sethu@gmail.com"
        const dummyPassword="12345"

        loginForm.addEventListener("submit", function (event) {
            event.preventDefault();

            const email = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            const emailCorrect = email === dummyEmail;
            const passwordCorrect = password === dummyPassword;

            if (emailCorrect && passwordCorrect) {
                alert("Login successful");
                return;
            }
            else if (!emailCorrect && !passwordCorrect) {
                alert("Invalid email and password");
                return;
            }
            else if (!emailCorrect) {
                alert("Invalid email");
                return;
            }
            else if (!passwordCorrect) {
                alert("Invalid password");
                return;
            }

        })

        function showAlert(message, type) {


        }

    </script>
</body>

</html>
